enableScripts: true

enableTelemetry: false

# node-modules rather than Plug'n'Play so bun can resolve dependencies: bun
# reads a real node_modules tree, not Yarn's PnP loader. hardlinks-global shares
# the unpacked files with other node-modules projects through the global store.
nodeLinker: node-modules

nmMode: hardlinks-global

npmMinimalAgeGate: 0

# Pin Yarn 4 for the toolkit. The repository root ships a legacy Yarn 2 through
# its own yarnPath, and Yarn merges rc files up the tree, so without this closer
# yarnPath a `yarn` run inside toolkit/ would hand off to that Yarn 2 binary.
yarnPath: .yarn/releases/yarn-4.14.1.cjs
