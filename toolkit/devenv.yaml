# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  # The release channel, matching the base project (agents-mj) so the pinned
  # nodejs, yarn-berry and bun versions line up.
  nixpkgs:
    url: github:NixOS/nixpkgs/nixos-26.05
  git-hooks:
    url: github:cachix/git-hooks.nix
    inputs:
      nixpkgs:
        follows: nixpkgs
  treefmt-nix:
    url: github:numtide/treefmt-nix
    inputs:
      nixpkgs:
        follows: nixpkgs
